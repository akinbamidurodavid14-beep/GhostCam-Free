name: Build GhostCam APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q GhostCamFree-Android-Project-v1.zip -d source

      - name: Build APK
        run: gradle -p source/GhostCamFree assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostCam-Free-APK
          path: source/GhostCamFree/app/build/outputs/apk/debug/app-debug.apk
          
